name: SmartTrade verification

on:
  push:
    branches:
      - neon-better-auth-api
  pull_request:
    branches:
      - main
      - neon-better-auth-api
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smarttrade-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency vulnerability report
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require("node:fs");
          const audit = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
          const counts = audit.metadata?.vulnerabilities ?? {};
          const lines = [
            "## npm dependency audit",
            "",
            `Totals: critical ${counts.critical ?? 0}, high ${counts.high ?? 0}, moderate ${counts.moderate ?? 0}, low ${counts.low ?? 0}, info ${counts.info ?? 0}.`,
            "",
            "| Package | Severity | Vulnerable range | Fix available | Advisory |",
            "|---|---|---|---|---|",
          ];
          for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) {
            const advisories = (item.via ?? []).filter(v => typeof v === "object");
            const advisory = advisories.map(v => v.title || v.url || "Advisory").join("; ") || "Transitive dependency";
            lines.push(`|${name}|${item.severity}|${item.range || "—"}|${item.fixAvailable ? JSON.stringify(item.fixAvailable) : "No"}|${advisory}|`);
          }
          const report = lines.join("\\n");
          console.log(report);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, report + "\\n");
          NODE
      - name: TypeScript validation
        run: npm run typecheck

      - name: Expo web production export
        run: npm run build:web
