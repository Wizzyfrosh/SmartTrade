name: Refresh npm lockfile

on:
  push:
    branches:
      - neon-better-auth-api
    paths:
      - package.json
      - "src/**/*.ts"
      - "src/**/*.tsx"
      - "api/**/*.ts"
      - "app/**/*.tsx"
      - app.json
      - vercel.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smarttrade-lockfile-{{ github.ref }}
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: neon-better-auth-api
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile when changed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh package lock for Better Auth"
            git pull --rebase origin neon-better-auth-api
            git push origin HEAD:neon-better-auth-api
          fi
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript validation
        run: npm run typecheck
      - name: Expo web export
        run: npm run build:web
